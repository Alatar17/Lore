<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="50%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" opacity="0.18" filter="url(#glow)"/>

  <!-- Film Clapper / Strip (Left/Top) -->
  <g transform="translate(130, 130) scale(1.05)">
    <!-- Clapper / Film Header -->
    <path d="M20 50 C20 33.4 33.4 20 50 20 L190 20 C206.6 20 220 33.4 220 50 L220 80 L20 80 Z" fill="#2a2e3d" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4"/>
    
    <!-- Diagonal Stripes -->
    <path d="M45 20 L25 80 M85 20 L65 80 M125 20 L105 80 M165 20 L145 80 M205 20 L185 80" stroke="#ffffff" stroke-width="6" stroke-opacity="0.85" stroke-linecap="round"/>

    <!-- Film Frame Body -->
    <rect x="20" y="80" width="200" height="130" rx="12" fill="#181b24" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4"/>
    
    <!-- Film Perforations -->
    <rect x="32" y="95" width="16" height="22" rx="4" fill="#ffffff" opacity="0.8"/>
    <rect x="32" y="135" width="16" height="22" rx="4" fill="#ffffff" opacity="0.8"/>
    <rect x="32" y="175" width="16" height="22" rx="4" fill="#ffffff" opacity="0.8"/>
    
    <rect x="192" y="95" width="16" height="22" rx="4" fill="#ffffff" opacity="0.8"/>
    <rect x="192" y="135" width="16" height="22" rx="4" fill="#ffffff" opacity="0.8"/>
    <rect x="192" y="175" width="16" height="22" rx="4" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Gamepad Emblem in Center / Bottom Right -->
  <g transform="translate(195, 220) scale(1.15)">
    <!-- Gamepad Body -->
    <path d="M30 45 C30 25 45 10 75 10 L125 10 C155 10 170 25 170 45 C170 70 155 100 135 100 C125 100 115 90 100 90 C85 90 75 100 65 100 C45 100 30 70 30 45 Z" fill="#252a38" stroke="url(#glowGrad)" stroke-width="5"/>

    <!-- D-Pad -->
    <path d="M60 38 L68 38 L68 30 L76 30 L76 38 L84 38 L84 46 L76 46 L76 54 L68 54 L68 46 L60 46 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Action Buttons (A B X Y) -->
    <circle cx="132" cy="34" r="4.5" fill="#ec4899"/>
    <circle cx="144" cy="42" r="4.5" fill="#3b82f6"/>
    <circle cx="120" cy="42" r="4.5" fill="#10b981"/>
    <circle cx="132" cy="50" r="4.5" fill="#f59e0b"/>

    <!-- Center Indicator -->
    <rect x="94" y="40" width="12" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Golden Rating Star Emblem in Top Right -->
  <g transform="translate(340, 100) scale(0.95)">
    <polygon points="25,2 32,18 49,18 35,29 40,46 25,35 10,46 15,29 1,18 18,18" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  </g>
</svg>
