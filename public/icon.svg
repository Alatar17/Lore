<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151924"/>
      <stop offset="45%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>

    <!-- Outer Rim Light -->
    <linearGradient id="rimLight" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Ambient Glow Gradient -->
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Clapperboard Metallic Shading -->
    <linearGradient id="clapperBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242938"/>
      <stop offset="50%" stop-color="#181c27"/>
      <stop offset="100%" stop-color="#11131c"/>
    </linearGradient>

    <linearGradient id="clapperStick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e2230"/>
      <stop offset="100%" stop-color="#2a3044"/>
    </linearGradient>

    <linearGradient id="stripeWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Gamepad Shading -->
    <linearGradient id="padBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2c3244"/>
      <stop offset="40%" stop-color="#1f2433"/>
      <stop offset="100%" stop-color="#131620"/>
    </linearGradient>

    <linearGradient id="padBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="stickGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1e2a"/>
      <stop offset="100%" stop-color="#0d0f15"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filters -->
    <filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="padGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <clipPath id="clapperTopClip">
      <rect x="0" y="0" width="220" height="42" rx="8"/>
    </clipPath>

    <clipPath id="clapperBottomStickClip">
      <rect x="0" y="0" width="220" height="38" rx="6"/>
    </clipPath>
  </defs>

  <!-- Base App Squircle Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGradient)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#rimLight)" stroke-width="4"/>

  <!-- Radial Aura Glow behind icons -->
  <circle cx="256" cy="256" r="210" fill="url(#centerAura)"/>

  <!-- ======================================================== -->
  <!-- 1. CINEMA CLAPPERBOARD (Top-Left Dynamic Composition)     -->
  <!-- ======================================================== -->
  <g id="cinemaClapper" filter="url(#shadowDepth)" transform="translate(105, 95)">
    <!-- Clapper Slate Body (Lower board) -->
    <rect x="20" y="70" width="240" height="175" rx="16" fill="url(#clapperBody)" stroke="#3b4256" stroke-width="2.5"/>
    
    <!-- Film Strip / Perforation Accent on left edge of slate -->
    <g opacity="0.45">
      <rect x="32" y="86" width="14" height="18" rx="3.5" fill="#94a3b8"/>
      <rect x="32" y="118" width="14" height="18" rx="3.5" fill="#94a3b8"/>
      <rect x="32" y="150" width="14" height="18" rx="3.5" fill="#94a3b8"/>
      <rect x="32" y="182" width="14" height="18" rx="3.5" fill="#94a3b8"/>
      <rect x="32" y="214" width="14" height="18" rx="3.5" fill="#94a3b8"/>
    </g>

    <!-- Minimalist Cine Slate Lines (Pure aesthetic, no text) -->
    <rect x="62" y="94" width="80" height="4" rx="2" fill="#475569" opacity="0.5"/>
    <rect x="62" y="110" width="55" height="3.5" rx="2" fill="#475569" opacity="0.35"/>
    <rect x="62" y="140" width="68" height="3.5" rx="2" fill="#475569" opacity="0.25"/>

    <!-- Fixed Lower Clapper Strip (Hinged base) -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="240" height="36" rx="6" fill="url(#clapperStick)"/>
      <g clip-path="url(#clapperBottomStickClip)">
        <!-- Crisp diagonal stripes -->
        <polygon points="35,0 55,0 25,38 5,38" fill="url(#stripeWhite)"/>
        <polygon points="85,0 105,0 75,38 55,38" fill="url(#stripeWhite)"/>
        <polygon points="135,0 155,0 125,38 105,38" fill="url(#stripeWhite)"/>
        <polygon points="185,0 205,0 175,38 155,38" fill="url(#stripeWhite)"/>
      </g>
    </g>

    <!-- Top Hinged Clapper Stick (Angled open ~14 degrees for dynamic cinema look) -->
    <g transform="translate(18, 38) rotate(-14)">
      <rect x="0" y="-36" width="242" height="36" rx="8" fill="url(#clapperStick)" stroke="#475569" stroke-width="1.5"/>
      <g clip-path="url(#clapperTopClip)" transform="translate(0, -36)">
        <polygon points="35,0 55,0 25,42 5,42" fill="url(#stripeWhite)"/>
        <polygon points="85,0 105,0 75,42 55,42" fill="url(#stripeWhite)"/>
        <polygon points="135,0 155,0 125,42 105,42" fill="url(#stripeWhite)"/>
        <polygon points="185,0 205,0 175,42 155,42" fill="url(#stripeWhite)"/>
      </g>
    </g>

    <!-- Mechanical Hinge Bolt (Left pivot) -->
    <circle cx="28" cy="46" r="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="28" cy="46" r="5" fill="#cbd5e1"/>
    <circle cx="27" cy="44.5" r="1.5" fill="#ffffff"/>
  </g>

  <!-- ======================================================== -->
  <!-- 2. GAMEPAD CONTROLLER (Overlapping Foreground Focus)       -->
  <!-- ======================================================== -->
  <g id="gamepad" filter="url(#padGlow)" transform="translate(178, 222)">
    <!-- Controller Outer Silhouette & Grips -->
    <path d="M 52 50 
             C 52 24, 76 12, 114 12 
             L 166 12 
             C 204 12, 228 24, 228 50 
             C 228 78, 214 116, 186 128 
             C 174 133, 160 126, 146 112 
             C 140 106, 134 104, 140 104 
             C 146 104, 140 106, 134 112 
             C 120 126, 106 133, 94 128 
             C 66 116, 52 78, 52 50 Z" 
          fill="url(#padBody)" 
          stroke="url(#padBorder)" 
          stroke-width="4.5" 
          stroke-linejoin="round"/>

    <!-- Subtle Ergonomic Grip Highlights -->
    <path d="M 64 54 C 64 78, 74 106, 92 116" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 216 54 C 216 78, 206 106, 188 116" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Modern Central Light Bar / Touchpad Strip -->
    <rect x="122" y="24" width="36" height="7" rx="3.5" fill="#38bdf8" opacity="0.85"/>
    <circle cx="140" cy="38" r="3" fill="#64748b" opacity="0.7"/>

    <!-- Directional Pad (D-Pad, Left side) -->
    <g transform="translate(86, 44)">
      <!-- Cross Base -->
      <path d="M 12 0 
               L 22 0 
               L 22 12 
               L 34 12 
               L 34 22 
               L 22 22 
               L 22 34 
               L 12 34 
               L 12 22 
               L 0 22 
               L 0 12 
               L 12 12 Z" 
            fill="#181c28" 
            stroke="#475569" 
            stroke-width="2" 
            stroke-linejoin="round"/>
      <!-- Directional Arrow Indents -->
      <polygon points="17,3 14,7 20,7" fill="#94a3b8"/>
      <polygon points="17,31 14,27 20,27" fill="#94a3b8"/>
      <polygon points="3,17 7,14 7,20" fill="#94a3b8"/>
      <polygon points="31,17 27,14 27,20" fill="#94a3b8"/>
      <!-- Center Well -->
      <circle cx="17" cy="17" r="3.5" fill="#0f1118"/>
    </g>

    <!-- Action Buttons (Right side - 4 Diamond arrangement with glowing jewel colors) -->
    <g transform="translate(174, 44)">
      <!-- Top Button (Y / Violet) -->
      <circle cx="17" cy="3" r="6.5" fill="#a855f7" stroke="#e9d5ff" stroke-width="1.5"/>
      <!-- Right Button (B / Coral Pink) -->
      <circle cx="31" cy="17" r="6.5" fill="#f43f5e" stroke="#ffe4e6" stroke-width="1.5"/>
      <!-- Bottom Button (A / Electric Cyan) -->
      <circle cx="17" cy="31" r="6.5" fill="#06b6d4" stroke="#cffafe" stroke-width="1.5"/>
      <!-- Left Button (X / Emerald Green) -->
      <circle cx="3" cy="17" r="6.5" fill="#10b981" stroke="#d1fae5" stroke-width="1.5"/>
    </g>

    <!-- Dual Analog Thumbsticks -->
    <!-- Left Thumbstick -->
    <g transform="translate(108, 76)">
      <circle cx="16" cy="16" r="16" fill="#151822" stroke="#334155" stroke-width="2"/>
      <circle cx="16" cy="16" r="12" fill="url(#stickGradient)"/>
      <circle cx="16" cy="16" r="9" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.75"/>
      <circle cx="14" cy="14" r="2.5" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- Right Thumbstick -->
    <g transform="translate(156, 76)">
      <circle cx="16" cy="16" r="16" fill="#151822" stroke="#334155" stroke-width="2"/>
      <circle cx="16" cy="16" r="12" fill="url(#stickGradient)"/>
      <circle cx="16" cy="16" r="9" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.75"/>
      <circle cx="14" cy="14" r="2.5" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>
</svg>
